# Same-origin production routing (one origin for the SPA and the API):
#   /            -> built SPA (index.html fallback for client-side routes)
#   /assets/*    -> content-hashed static files, cached for a year
#   /api/*       -> FastAPI (session cookie is first-party; responses are never cached)
#   /health/*    -> FastAPI liveness/readiness (public by design)
#   /healthz     -> nginx's own container health check
#
# TLS is NOT terminated here. Put an HTTPS reverse proxy / load balancer in front for any
# non-localhost deployment (see DEPLOYMENT.md); the session cookie is Secure.

# Docker's embedded DNS; `resolve` re-resolves `api` so a recreated API container (new IP)
# is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fastapi {
    zone fastapi 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 64k;   # same limit as the API's MAX_REQUEST_BYTES

    # Baseline security headers for every response (including errors).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ggpht.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host/Origin pass through unchanged: the API's CSRF Origin check compares them.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # predictions may take up to ~30 s client-side
        proxy_buffering on;

        # Authenticated, per-user data: never stored by browsers or intermediaries.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /health/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # API docs are disabled in production (APP_ENV=production); never fall through to the SPA.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location /assets/ {
        # File names contain content hashes, so they can be cached "forever".
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # SPA fallback; index.html itself must always be revalidated so new deploys show up.
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ggpht.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
